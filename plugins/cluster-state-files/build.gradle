apply plugin: 'opensearch.opensearchplugin'

opensearchplugin {
  description = 'A proof-of-concept ClusterStatePersistence that writes cluster state to local files.'
  classname = 'org.opensearch.cluster.state.files.FileClusterStatePlugin'
}

// No external dependencies — only uses server APIs.
dependencies {
}

// PoC plugin — most checks disabled, but unit tests run.
testingConventions.enabled = false
forbiddenApisMain.enabled = false
forbiddenApisTest.enabled = false
licenseHeaders.enabled = false
validateNebulaPom.enabled = false
dependencyLicenses.enabled = false
thirdPartyAudit.enabled = false
